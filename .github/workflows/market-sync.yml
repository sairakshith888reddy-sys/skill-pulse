name: Automated Market Data Extractor

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  extract-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install @supabase/supabase-js

      - name: Execute Live Extractor
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://yvvwnjbejhhfhodwrhis.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_krHDJfg-y8ylEvpsFp3pCA_KIoQxKPz' }}
        run: node scripts/extract-jobs.js
